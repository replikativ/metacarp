name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Both jobs need the reference Carp compiler (setup-carp clones, builds, and
# caches stock Carp, and rewrites git@ dependency URLs to https for the
# runner, and exports CARP_DIR, which the scripts and test fixtures use to
# find the standard library and reference test suite). Library dependencies,
# carp-reader included, install themselves as git references.

jobs:
  suites:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            style: false
            skip_style: '1'
          - os: ubuntu-latest
            style: true
            skip_style: '0'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          path: carp-compiler

      - name: Setup Carp
        uses: carpentry-org/setup-carp@v1
        with:
          # stock carp, pinned just before the box-as-core-type refactor
          # (carp-lang/Carp#1571) this compiler does not follow yet.
          carp-ref: 8e190f2c5e077cb078450ec83e26c67bc7d4be90

      - name: Install angler
        if: matrix.style
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/carpentry-org/angler /tmp/angler
          (cd /tmp/angler && carp -b main.carp)
          sudo install -m 755 /tmp/angler/out/angler /usr/local/bin/

      - name: Install carp-fmt
        if: matrix.style
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/carpentry-org/carp-fmt /tmp/carp-fmt
          (cd /tmp/carp-fmt && carp -b main.carp)
          sudo install -m 755 /tmp/carp-fmt/out/carp-fmt /usr/local/bin/

      - name: Phase assurance
        env:
          CARP_SKIP_STYLE: ${{ matrix.skip_style }}
          CARP_PHASE_JOBS: '2'
        run: |
          set -euo pipefail
          cd carp-compiler
          ./scripts/run-assurance.sh phase

  self-host:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          path: carp-compiler

      - name: Setup Carp
        uses: carpentry-org/setup-carp@v1
        with:
          # stock carp, pinned just before the box-as-core-type refactor
          # (carp-lang/Carp#1571) this compiler does not follow yet.
          carp-ref: 8e190f2c5e077cb078450ec83e26c67bc7d4be90

      - name: Self-host assurance
        env:
          CARP_SELF_JOBS: '2'
        run: |
          set -euo pipefail
          cd carp-compiler
          ./scripts/run-assurance.sh self
